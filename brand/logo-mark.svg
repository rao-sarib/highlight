<svg width="160" height="160" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Highlight mark">
  <defs>
    <linearGradient id="hl-grad" x1="8" y1="44" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F55EE"/>
      <stop offset="1" stop-color="#1BC8E8"/>
    </linearGradient>
  </defs>
  <!-- rising rankings -->
  <rect x="13" y="36" width="8" height="15" rx="3" fill="#0B1220" opacity="0.85"/>
  <rect x="26" y="28" width="8" height="23" rx="3" fill="#0B1220" opacity="0.92"/>
  <rect x="39" y="19" width="8" height="32" rx="3" fill="#0B1220"/>
  <!-- highlighter swipe across the growth -->
  <rect x="7" y="14" width="52" height="12" rx="6" fill="url(#hl-grad)" opacity="0.5" transform="rotate(-22 32 26)"/>
  <!-- top spot reached -->
  <circle cx="48" cy="14" r="4.3" fill="url(#hl-grad)"/>
  <circle cx="48" cy="14" r="1.7" fill="#ffffff"/>
</svg>
